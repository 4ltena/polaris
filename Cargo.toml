[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.12.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "time", "sync", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
async-trait = "0.1"
tiktoken-rs = "0.12"
regex = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
wiremock = "0.6"
tempfile = "3"
toml = "0.8"
sha2 = "0.10"
base64 = "0.22"
url = "2"
futures-util = "0.3"
ratatui = { version = "0.29", features = ["scrolling-regions"] }
crossterm = { version = "0.28", features = ["event-stream"] }
jsonschema = { version = "0.51", default-features = false }
similar = "2"
unicode-width = "0.2"

# Native debug apps verify large local models and packaged helper bytes before Hello.
# Keep the complete SHA-256 checks fast without changing the application debug profile.
[profile.dev.package.sha2]
opt-level = 3
