[package]
name = "polaris-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "polaris"
path = "src/main.rs"

[dependencies]
polaris-auth = { path = "../polaris-auth" }
polaris-core = { path = "../polaris-core" }
polaris-provider = { path = "../polaris-provider" }
polaris-sandbox = { path = "../polaris-sandbox" }
polaris-skills = { path = "../polaris-skills" }
async-trait = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# 本物のバイナリを本物のプロファイルの下でヘルパとして起動する統合テスト
# （tests/confined_helper.rs）が、ツール層をそのまま通すために要る。
polaris-tools = { path = "../polaris-tools" }
tempfile = { workspace = true }
