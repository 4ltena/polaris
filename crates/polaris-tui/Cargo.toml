[package]
name = "polaris-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
polaris-memory = { path = "../polaris-memory" }
polaris-auth = { path = "../polaris-auth" }
polaris-core = { path = "../polaris-core" }
polaris-mcp = { path = "../polaris-mcp" }
polaris-provider = { path = "../polaris-provider" }
polaris-sandbox = { path = "../polaris-sandbox" }
polaris-skills = { path = "../polaris-skills" }
ratatui = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
tempfile = { workspace = true }
polaris-core = { path = "../polaris-core", features = ["mcp-test-support", "execution-test-support"] }
polaris-mcp = { path = "../polaris-mcp", features = ["test-support"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
polaris-desktop-service = { path = "../polaris-desktop-service" }
polaris-desktop-protocol = { path = "../polaris-desktop-protocol" }
